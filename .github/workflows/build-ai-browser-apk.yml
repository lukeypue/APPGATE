name: Build AI Browser Android APK

on:
  push:
    branches: [ ai-browser-android-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare AI Browser v2 source
        run: |
          rm -rf ai-browser-v2-build
          mkdir ai-browser-v2-build
          unzip -q ai-browser-v2-source.zip -d ai-browser-v2-build
      - name: Run v2 unit tests
        working-directory: ai-browser-v2-build
        run: gradle testDebugUnitTest --stacktrace
      - name: Build v2 debug APK
        working-directory: ai-browser-v2-build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Browser-Android-v2-APK
          path: ai-browser-v2-build/app/build/outputs/apk/debug/app-debug.apk
