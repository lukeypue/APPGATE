name: Build AppGate APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Locate the Android project
        id: proj
        run: |
          if [ -f settings.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find . -maxdepth 3 -name settings.gradle -not -path "*/node_modules/*" | head -1)
            if [ -z "$FOUND" ]; then
              echo "ERROR: settings.gradle not found anywhere in the repo."
              exit 1
            fi
            echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Site Brain core and lab tests
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle :sitebrain-core:test :sitebrain-lab:test --stacktrace

      - name: Run Android unit tests
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Prepare latest updater APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/ai-browser-v6-deep-search'
        run: |
          APK=$(find . -path '*/app/build/outputs/apk/debug/app-debug.apk' -print -quit)
          test -n "$APK"
          cp "$APK" AI-Browser-latest.apk

      - name: Publish fixed latest release for in-app Update button
        if: github.event_name == 'push' && github.ref == 'refs/heads/ai-browser-v6-deep-search'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ai-browser-latest >/dev/null 2>&1; then
            gh release upload ai-browser-latest AI-Browser-latest.apk --clobber
            gh release edit ai-browser-latest --title "AI Browser Latest" --notes "Latest verified AI Browser build. Install over the existing app to preserve Site Brain data."
          else
            gh release create ai-browser-latest AI-Browser-latest.apk --title "AI Browser Latest" --notes "Latest verified AI Browser build. Install over the existing app to preserve Site Brain data."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppGate-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
