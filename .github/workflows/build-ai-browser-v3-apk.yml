name: Build AI Browser v3 Android APK

on:
  push:
    branches: [ ai-browser-android-v3 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare AI Browser v3 source
        run: |
          rm -rf ai-browser-v3-build ai-browser-v3-source.zip
          base64 --decode ai-browser-v3-source.b64 > ai-browser-v3-source.zip
          unzip -t ai-browser-v3-source.zip
          mkdir ai-browser-v3-build
          unzip -q ai-browser-v3-source.zip -d ai-browser-v3-build
      - name: Run v3 unit tests
        working-directory: ai-browser-v3-build
        run: gradle testDebugUnitTest --stacktrace
      - name: Build v3 debug APK
        working-directory: ai-browser-v3-build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Browser-Android-v3-APK
          path: ai-browser-v3-build/app/build/outputs/apk/debug/app-debug.apk
