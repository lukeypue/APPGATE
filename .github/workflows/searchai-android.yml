name: Build SearchAI Android APK

on:
  push:
    branches:
      - searchai-android-build
    paths:
      - 'searchai-android/**'
      - '.github/workflows/searchai-android.yml'
  workflow_dispatch:

jobs:
  build-searchai-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack SearchAI Android source
        shell: bash
        run: |
          mkdir -p searchai-android/project
          base64 -d searchai-android/SearchAI-Android-Source.b64 > /tmp/SearchAI-Android-Source.zip
          unzip -q /tmp/SearchAI-Android-Source.zip -d searchai-android/project
          test -f searchai-android/project/settings.gradle.kts

      - name: Run Android unit tests
        working-directory: searchai-android/project
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Android debug APK
        working-directory: searchai-android/project
        run: gradle assembleDebug --stacktrace

      - name: Assemble APK artifact
        shell: bash
        run: |
          mkdir -p release
          cp searchai-android/project/app/build/outputs/apk/debug/app-debug.apk release/SearchAI-debug.apk
          printf 'SearchAI Android MVP\n\nInstall SearchAI-debug.apk on an Android phone.\nHuman verification is always completed manually.\n' > release/START_HERE.txt
          test -s release/SearchAI-debug.apk
          unzip -l release/SearchAI-debug.apk | grep -q 'AndroidManifest.xml'
          unzip -l release/SearchAI-debug.apk | grep -q 'classes.dex'

      - name: Upload SearchAI Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SearchAI-Android-APK
          path: release/
          retention-days: 30
          if-no-files-found: error
