name: Build AI Browser Android APK

on:
  push:
    branches: [ ai-browser-android-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        working-directory: ai-browser-android
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: ai-browser-android
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Browser-Android-APK
          path: ai-browser-android/app/build/outputs/apk/debug/app-debug.apk
