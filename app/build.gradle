plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def stableKeystorePath = System.getenv('AI_BROWSER_KEYSTORE_PATH')
def stableSigningPassword = System.getenv('AI_BROWSER_SIGNING_PASSWORD')
def stableSigningEnabled = stableKeystorePath && stableSigningPassword

android {
    namespace 'com.appgate.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.aibrowser.universal"
        minSdk 26
        targetSdk 34
        versionCode 26
        versionName "6.18.0-smart-security-gates"
    }

    signingConfigs {
        stableRelease {
            if (stableSigningEnabled) {
                storeFile file(stableKeystorePath)
                storePassword stableSigningPassword
                keyAlias 'aibrowser'
                keyPassword stableSigningPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (stableSigningEnabled) {
                signingConfig signingConfigs.stableRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation project(':sitebrain-core')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
