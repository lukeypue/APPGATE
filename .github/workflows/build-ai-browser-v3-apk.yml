name: Build AI Browser v3 Android APK

on:
  push:
    branches: [ ai-browser-android-v3 ]
  workflow_dispatch:

# v3 source is reconstructed from checksum-verified chunks.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare and verify AI Browser v3 source
        run: |
          rm -rf ai-browser-v3-build ai-browser-v3-source.zip ai-browser-v3-source-clean.b64
          cat ai-browser-v3-source.b64.00 ai-browser-v3-source.b64.01 ai-browser-v3-source.b64.02 ai-browser-v3-source.b64.03 ai-browser-v3-source.b64.04 ai-browser-v3-source.b64.05 ai-browser-v3-source.b64.06 ai-browser-v3-source.b64.07 ai-browser-v3-source.b64.08 ai-browser-v3-source.b64.09 ai-browser-v3-source.b64.10 | tr -d '[:space:]' > ai-browser-v3-source-clean.b64
          echo "519d27329e94b66842ae4844159574b12ecd817b88445b0a9f62c183d6abc36b  ai-browser-v3-source-clean.b64" | sha256sum -c -
          base64 --decode ai-browser-v3-source-clean.b64 > ai-browser-v3-source.zip
          echo "b55a21c3467d3ceff26876073f8e340c4d34d3ad79f3a1eaaa60fc005d3d4a5d  ai-browser-v3-source.zip" | sha256sum -c -
          unzip -t ai-browser-v3-source.zip
          mkdir ai-browser-v3-build
          unzip -q ai-browser-v3-source.zip -d ai-browser-v3-build
      - name: Run v3 unit tests
        working-directory: ai-browser-v3-build
        run: gradle testDebugUnitTest --stacktrace
      - name: Build v3 debug APK
        working-directory: ai-browser-v3-build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Browser-Android-v3-APK
          path: ai-browser-v3-build/app/build/outputs/apk/debug/app-debug.apk
