plugins {
    id 'com.android.application'
}

def stableKeystorePath = System.getenv('AI_BROWSER_KEYSTORE_PATH')
def stableSigningPassword = System.getenv('AI_BROWSER_SIGNING_PASSWORD')
def stableSigningEnabled = stableKeystorePath && stableSigningPassword

android {
    namespace 'com.appgate.tv'
    compileSdk 37

    defaultConfig {
        applicationId "com.aibrowser.universal"
        minSdk 26
        targetSdk 34
        versionCode 40
        versionName "6.32.0-gecko-browser-foundation"
    }

    signingConfigs {
        stableRelease {
            if (stableSigningEnabled) {
                storeFile file(stableKeystorePath)
                storePassword stableSigningPassword
                keyAlias 'aibrowser'
                keyPassword stableSigningPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (stableSigningEnabled) {
                signingConfig signingConfigs.stableRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':sitebrain-core')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.mozilla.geckoview:geckoview:155.0.20260903215306'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
