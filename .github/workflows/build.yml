name: Build AppGate APK

on:
  push:
  workflow_dispatch:        # adds a manual "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Works whether the project files are at the repo root or inside a subfolder
      - name: Locate the Android project
        id: proj
        run: |
          if [ -f settings.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find . -maxdepth 3 -name settings.gradle -not -path "*/node_modules/*" | head -1)
            if [ -z "$FOUND" ]; then
              echo "ERROR: settings.gradle not found anywhere in the repo."
              echo "Make sure the AppGate project files (app folder, settings.gradle, build.gradle) were uploaded."
              exit 1
            fi
            echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
          fi
          echo "Building in: $(cat "$GITHUB_OUTPUT")"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppGate-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
